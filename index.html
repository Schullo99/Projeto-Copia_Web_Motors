        <h2>Buscar Veículos</h2>
        <form method="GET" class="row g-3 mb-4">
            <div class="col-md-3">
                <input type="text" name="nome" class="form-control" placeholder="Nome" value="<?= htmlspecialchars($nome ?? '') ?>">

                <input type="number" name="ano" class="form-control" placeholder="Ano" value="<?= htmlspecialchars($ano ?? '') ?>">
