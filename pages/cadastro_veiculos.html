<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Veículo</title>
</head>
<body>
    <h2>Cadastro de Veículo</h2>
    <form action="upload.php" method="POST" enctype="multipart/form-data">
        Nome: <input type="text" name="nome" required><br><br>
        Marca: <input type="text" name="marca" required><br><br>
        Ano: <input type="number" name="ano" required><br><br>
        Quilometragem: <input type="number" name="quilometragem" required><br><br>
        Imagem: <input type="file" name="imagem" accept="image/*" required><br><br>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
