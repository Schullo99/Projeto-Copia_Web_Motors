                <form action="upload.php" method="POST" enctype="multipart/form-data" class="border p-4 rounded shadow-sm bg-light">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>

                    <div class="mb-3">

                        <input type="text" id="marca" name="marca" class="form-control" required>

                        <label for="ano" class="form-label">Ano</label>
                        <input type="number" id="ano" name="ano" class="form-control" required>

                        <label for="quilometragem" class="form-label">Quilometragem</label>
                        <input type="number" id="quilometragem" name="quilometragem" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="imagem" class="form-label">Imagem</label>
                        <input type="file" id="imagem" name="imagem" class="form-control" accept="image/*" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-danger">Cadastrar</button>
                    </div>
                </form>
            </div>
